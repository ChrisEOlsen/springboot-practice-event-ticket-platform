spring.application.name=backend

# Load local settings when launched from the repository root or backend directory.
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# HTTP server (provided by Docker Compose)
server.port=${SERVER_PORT:8080}

# Database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OAuth2 resource server: validate Keycloak bearer JWTs.
# Create this realm in Keycloak, or override KEYCLOAK_REALM.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:9090/realms/${KEYCLOAK_REALM:event-ticket-platform}}
# Compose overrides this with Keycloak's internal address for signing-key retrieval.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
