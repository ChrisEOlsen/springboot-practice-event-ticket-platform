services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: ["postgres", "-p", "${POSTGRES_PORT}"]
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -p '${POSTGRES_PORT}' -U '${POSTGRES_USER}' -d '${POSTGRES_DB}'"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:${POSTGRES_PORT}/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SERVER_PORT: ${BACKEND_PORT}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-event-ticket-platform}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:9090/realms/${KEYCLOAK_REALM:-event-ticket-platform}}
      KEYCLOAK_JWK_SET_URI: http://keycloak:9090/realms/${KEYCLOAK_REALM:-event-ticket-platform}/protocol/openid-connect/certs
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--port", "${FRONTEND_PORT}"]
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--http-port=9090"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    ports:
      - "9090:9090"
    volumes:
      - keycloak_data:/opt/keycloak/data

  adminer:
    image: adminer:6.1.2
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db:${POSTGRES_PORT}
    ports:
      - "${ADMINER_PORT:-8888}:8080"

volumes:
  postgres_data:
  keycloak_data:
